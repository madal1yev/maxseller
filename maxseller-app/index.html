<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaxSeller — Raqamli mahsulotlar do'koni</title>
    <meta name="description" content="MaxSeller: veb-saytlar, dizayn shablonlar, ilmiy ishlar va video darsliklar. Tezkor sotuv, 24/7 xizmat." />
    <meta name="theme-color" content="#05100a" />
    <script>
      try {
        var storedTheme = localStorage.getItem('maxseller-theme');
        var storedLang = localStorage.getItem('maxseller-lang');
        if (storedTheme === 'light' || storedTheme === 'dark') document.documentElement.dataset.theme = storedTheme;
        if (storedLang === 'uz' || storedLang === 'ru' || storedLang === 'en') document.documentElement.lang = storedLang;
      } catch (error) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/store/main.tsx"></script>
  </body>
</html>
